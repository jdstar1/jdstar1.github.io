<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Jdstar | Saree Manufacturer</title><meta name="description" content="Jdstar, manufacturer of Banarasi silk fancy sarees. Satin silk, Banarasi and bridal sarees."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#f7f9fc;--surface:#fff;--ink:#13243a;--muted:#5a6b80;--brand:#1c4a7a;--gold:#d4a82a;--line:#d9e1ec;--on-brand:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1624;--surface:#132236;--ink:#eaf0f8;--muted:#9fb1c6;--brand:#8ab8ea;--gold:#e0b83a;--line:#223650;--on-brand:#1a0f15}}
:root[data-theme="dark"]{--bg:#0c1624;--surface:#132236;--ink:#eaf0f8;--muted:#9fb1c6;--brand:#8ab8ea;--gold:#e0b83a;--line:#223650;--on-brand:#1a0f15}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.bar{background:var(--brand);color:var(--on-brand);text-align:center;font-size:13px;padding:8px 12px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
header button{background:none;border:0;color:var(--brand);font-size:22px;cursor:pointer;padding:6px}
.logo{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:600;letter-spacing:.12em;color:var(--brand)}
.logo{display:flex;align-items:center;gap:10px;font-size:26px}.logo img{height:40px;width:40px;display:block}
.hero{margin:12px;border-radius:24px;overflow:hidden;position:relative;min-height:440px;color:#fff;padding:36px 24px;display:flex;flex-direction:column;justify-content:flex-end;
background:radial-gradient(circle at 80% 15%,rgba(255,214,102,.35),transparent 40%),repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px),linear-gradient(160deg,#2a6199,#0f2742 70%)}
.hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:44px;line-height:1.05;margin:0 0 10px}
.hero p{margin:0 0 22px;max-width:30ch;opacity:.92}
.btn{display:inline-block;border:1px solid var(--gold);background:#fff;color:#1c4a7a;border-radius:999px;padding:12px 26px;font:500 15px Jost,sans-serif;cursor:pointer;text-decoration:none;width:max-content}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:32px;color:var(--brand);text-align:center;margin:40px 16px 16px}
.cats{display:flex;gap:18px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.cat{flex:0 0 96px;text-align:center;font-size:13px;color:var(--muted);text-decoration:none}
.cat i{display:block;width:96px;height:96px;border-radius:50%;margin-bottom:8px;border:2px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px}
.card{background:var(--surface);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.card .img{aspect-ratio:3/4}
.card .t{padding:12px 12px 14px;text-align:center}
.card h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;font-weight:600;margin:0 0 4px;line-height:1.2}
.card span{font-size:14px;color:var(--muted)}
.card button{margin-top:10px;border:1px solid var(--line);background:none;color:var(--brand);border-radius:999px;padding:7px 16px;font:500 13px Jost,sans-serif;cursor:pointer}
.about,.contact{margin:40px 16px 0;text-align:center;color:var(--muted)}
.about p,.contact p{max-width:46ch;margin:0 auto 12px}
footer{margin-top:48px;padding:28px 16px calc(28px + 64px);text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
nav.tab{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav.tab a{font-size:12px;color:var(--muted);text-decoration:none;text-align:center}
nav.tab b{display:block;font-size:20px;color:var(--brand)}
:root{padding-bottom:0}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none}
.drawer.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;padding:28px 24px calc(28px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}
.sheet a{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:600;color:var(--brand);text-decoration:none;padding:7px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--brand);color:var(--on-brand);padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;display:none}
@media (min-width:760px){.grid{grid-template-columns:repeat(4,1fr);max-width:1000px;margin:auto}.hero{max-width:1000px;margin:12px auto}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.cat{cursor:pointer;background:none;border:0;font:inherit}.cat i{background-size:cover;background-position:center}.cat.on{color:var(--brand);font-weight:500}.cat.on i{border-color:var(--gold)}
.card .img{background-size:cover;background-position:center;position:relative}.sold{position:absolute;top:10px;left:10px;background:#b3202f;color:#fff;font-size:12px;padding:3px 10px;border-radius:999px}.card.s{opacity:.75}
.fab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--brand);color:var(--on-brand);border:0;border-radius:999px;padding:12px 20px;font:500 15px Jost,sans-serif;cursor:pointer}
.adm{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px}
.adm h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;color:var(--brand);margin:18px 0 10px}
.row{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.row .th{width:52px;height:64px;border-radius:8px;background-size:cover;background-position:center;flex:none}.row .nm{flex:1;min-width:0;font-size:14px}.row .nm small{color:var(--muted);display:block}
.row button,.adm .b{border:1px solid var(--line);background:var(--surface);color:var(--brand);border-radius:999px;padding:7px 12px;font:500 13px Jost,sans-serif;cursor:pointer}
.adm .b.p{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.adm input,.adm select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:16px Jost,sans-serif;margin-bottom:10px}
.adm label{font-size:14px;color:var(--muted)}.pv{width:110px;height:140px;border-radius:12px;background:var(--line) center/cover;margin-bottom:10px}
.code{display:block;font-size:12px;color:var(--brand);margin-bottom:2px}.info{margin:40px 16px 0;text-align:center}.info ul{max-width:46ch;margin:0 auto;padding-left:20px;text-align:left;color:var(--muted)}.info li{margin-bottom:8px}
.hero .sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s ease}
.hero .sl.on{opacity:1}
.hero.has::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,16,30,.82),rgba(8,16,30,.08) 65%);z-index:1}
.hero.has h1,.hero.has p,.hero.has .btn{position:relative;z-index:2}
.cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px}
.col{font-size:12px;color:var(--muted);margin-top:2px}
.lb{position:fixed;inset:0;z-index:70;background:rgba(10,14,22,.96);display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top,0px)}
.lb .top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:14px}
.lb .x{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
.lb .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;touch-action:pan-y}
.lb .stage img{max-width:100%;max-height:100%;object-fit:contain}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:26px;line-height:1;cursor:pointer}
.lb .pr{left:8px}.lb .nx{right:8px}
.lb .inf{padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));text-align:center}
.lb .inf h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;margin:0 0 4px}
.lb .col{color:#c9d3e0;font-size:14px}
.lb .btn{margin-top:12px}
.pvs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pvs div{width:72px;height:92px;border-radius:10px;background-size:cover;background-position:center;position:relative}
.pvs button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:1;cursor:pointer;padding:0}
.adm label.b{display:inline-block;color:var(--brand);cursor:pointer;margin:0 0 10px}
.row label.b{margin:0}
@media (prefers-reduced-motion:reduce){.hero .sl{transition:none}}
